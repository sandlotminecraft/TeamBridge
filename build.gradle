plugins {
    id 'java'
    id 'com.modrinth.minotaur' version "2.+"
}

group = 'com.sandlotminecraft'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "codemc-repo"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "ender-zone"
        url = "https://ci.ender.zone/plugin/repository/everything/"
    }
    maven {
        name = "alessiodp-repo"
        url = "https://repo.alessiodp.com/releases/"
    }
}

// The T-02 artifact, GriefPrevention 16.18.8-sandlot.1 (the trustee provider SPI). It is not
// published to any Maven repository, so it is a file dependency: by default the jar built in a
// sibling checkout of sandlotminecraft/GriefPrevention (`mvn package` on `sandlot/release`), or
// any path given with -PgriefPreventionJar=<path>.
def griefPreventionJar = findProperty('griefPreventionJar') ?: '../GriefPrevention/target/GriefPrevention.jar'

dependencies {
    compileOnly "org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT"
    compileOnly "org.popcraft:bolt-common:1.2.37"
    compileOnly "org.popcraft:bolt-bukkit:1.2.37"
    compileOnly "com.alessiodp.parties:parties-api:3.2.18"
    compileOnly "net.luckperms:api:5.5"
    compileOnly files(griefPreventionJar)

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

modrinth {
    token.set(System.getenv("MODRINTH_TOKEN"))
    projectId.set("boltparties")
    versionName.set("${project.name} ${version}")
    versionNumber.set("${version}")
    versionType.set("release")
    uploadFile.set(tasks.jar)
    gameVersions.addAll("1.19", "1.19.1", "1.19.2", "1.19.3", "1.19.4", "1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4")
    loaders.addAll("bukkit", "spigot", "paper")
    dependencies {
        required.project "bolt"
    }
}
